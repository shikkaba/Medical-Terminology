			function downloadJSON(data) {
				const flatTerms = [];

				for (const letter in data) {
					data[letter].forEach((word) => {
						const cleanId = word
							.toLowerCase()
							.replace(/\s+/g, "_")
							.replace(/[()]/g, "");
						flatTerms.push({
							id: `t_${cleanId}`,
							word: word,
							definition: "Enter definition here",
							prefixId: "p_change_me",
							rootId: "r_change_me",
							rootId2: "r_change_me",
							rootId3: "r_change_me",
							suffixId: "s_change_me",
						});
					});
				}

				// Create a downloadable blob
				const dataStr =
					"data:text/json;charset=utf-8," +
					encodeURIComponent(JSON.stringify(flatTerms, null, 2));
				const downloadAnchor = document.createElement("a");
				downloadAnchor.setAttribute("href", dataStr);
				downloadAnchor.setAttribute("download", "terms.json");
				document.body.appendChild(downloadAnchor);
				downloadAnchor.click();
				downloadAnchor.remove();
			}

			// Run the script on page load
			downloadJSON(rawData);
