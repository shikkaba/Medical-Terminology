<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Terminology Study Guide</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --primary: #007791;
            --accent: #e0f2f1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
        }

        nav {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e0e0e0;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .word {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0 0 0.5rem 0;
        }

        .definition {
            font-style: italic;
            margin-bottom: 1rem;
            color: #666;
        }

        .breakdown {
            display: none;
            border-top: 2px dashed var(--accent);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .breakdown.active {
            display: block;
        }

        .part {
            margin: 0.4rem 0;
            font-size: 0.9rem;
        }

        .label {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--accent);
            color: var(--primary);
            margin-right: 0.5rem;
        }
    </style>
</head>

<body>

    <h1>Medical Terminology Breakdown</h1>
    <h2>All Terms</h2>

    <nav>
        <div id="letter-nav"></div>
        <div id="filter"></div>
    </nav>

    <div class="container" id="card-container">Loading flashcards...</div>

    <script src="script.js" defer></script>
</body>

</html>
