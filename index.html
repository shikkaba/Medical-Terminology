<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Terminology Study Guide</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --primary: #007791;
            --accent: #e0f2f1;
            --colour1: #007791;
            --colour2: #009688;
            --colour3: #4CAF50;
            --colour4: #FFC107;
            --colour5: #FF5722;
            --colour6: #9C27B0;
            --colour7: #607D8B;
            --colour8: #E91E63;
            --colour9: #3F51B5;
            --colour10: #FF9800;
            --colour11: #8BC34A;
            --colour12: #673AB7;
            --colour13: #03A9F4;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
        }

        .filters {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            margin: 0 auto 50px;
        }

        #letter-nav {
            width: 100%;
            flex: 0 1 600px;
            display: flex;
            flex-direction: row;
            justify-content: start;
            position: relative;
            flex-wrap: wrap;
        }

        #letter-nav .btn {
            padding: 8px 14px;
            background-color: var(--card-bg);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        #filter {
            flex: 1 1 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e0e0e0;
        }

        .card.cardi {
            border: 4px solid var(--colour1);
        }

        .card.diges {
            border: 4px solid var(--colour2);
        }

        .card.endoc {
            border: 4px solid var(--colour3);
        }

        .card.gener {
            border: 4px solid var(--colour4);
        }

        .card.immun {
            border: 4px solid var(--colour5);
        }

        .card.integ {
            border: 4px solid var(--colour6);
        }

        .card.lymph {
            border: 4px solid var(--colour7);
        }

        .card.muscu {
            border: 4px solid var(--colour8);
        }

        .card.neuro {
            border: 4px solid var(--colour9);
        }

        .card.renal {
            border: 4px solid var(--colour10);
        }

        .card.respi {
            border: 4px solid var(--colour11);
        }

        .card.skele {
            border: 4px solid var(--colour12);
        }

        .card.urina {
            border: 4px solid var(--colour13);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .word h3 {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0 0 0.5rem 0;
        }

        .definition {
            font-style: italic;
            margin-bottom: 1rem;
            color: #666;
        }

        .breakdown {
            display: none;
            border-top: 2px dashed var(--accent);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .breakdown.active {
            display: block;
        }

        .part {
            margin: 0.4rem 0;
            font-size: 0.9rem;
        }

        .label {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--accent);
            color: var(--primary);
            margin-right: 0.5rem;
        }
    </style>
</head>

<body>

    <h1>Medical Terminology Breakdown</h1>
    <h2>All Terms</h2>

    <nav class="filters">
        <div id="letter-nav"></div>
        <div id="filter"></div>
    </nav>

    <div class="container" id="card-container">Loading flashcards...</div>

    <script src="script.js" defer></script>
</body>

</html>
